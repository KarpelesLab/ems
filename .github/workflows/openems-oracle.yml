name: openEMS oracle

# Regenerates the openEMS reference fixtures with a freshly built black-box
# openEMS (scripts/openems-oracle, clean-room rules in its README) and runs
# the test suite against them. Catches fixtures that no longer reproduce and
# upstream behaviour changes. Light on purpose: weekly, on demand, and when
# the fixtures or the oracle scripts change. Pushes and pull requests build
# the openEMS-Project revision the fixtures were made with
# (scripts/openems-oracle/REVISION_PIN); the weekly run (and a manual run
# with `upstream`) builds upstream HEAD instead and only reports drift.

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      upstream:
        description: "Build upstream openEMS-Project HEAD instead of the pinned revision"
        type: boolean
        default: false
  push:
    branches: [master]
    paths:
      - "tests/fixtures/openems/**"
      - "scripts/openems-oracle/**"
      - ".github/workflows/openems-oracle.yml"
  pull_request:
    paths:
      - "tests/fixtures/openems/**"
      - "scripts/openems-oracle/**"
      - ".github/workflows/openems-oracle.yml"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  oracle:
    name: Regenerate fixtures and test
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Upstream HEAD only reports drift; the pinned revision must pass.
    continue-on-error: ${{ github.event_name == 'schedule' || inputs.upstream == true }}
    steps:
      - uses: actions/checkout@v6

      - name: openEMS revision
        id: rev
        env:
          UPSTREAM: ${{ github.event_name == 'schedule' || inputs.upstream == true }}
        run: |
          if [ "$UPSTREAM" = true ]; then
            rev=$(git ls-remote https://github.com/thliebig/openEMS-Project.git HEAD | cut -f1)
          else
            rev=$(cut -d' ' -f1 scripts/openems-oracle/REVISION_PIN)
          fi
          echo "rev=$rev" >> "$GITHUB_OUTPUT"
          echo "openEMS-Project revision: $rev (upstream HEAD: $UPSTREAM)" >> "$GITHUB_STEP_SUMMARY"

      - name: Cache oracle
        id: cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ems-openems
          key: openems-oracle-ubuntu-24.04-${{ steps.rev.outputs.rev }}

      - name: Build dependencies
        timeout-minutes: 15
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          # man-db triggers can stall package installs on the runners;
          # retries and lock timeouts guard against slow mirrors.
          echo "man-db man-db/auto-update boolean false" | sudo debconf-set-selections
          sudo rm -f /var/lib/man-db/auto-update
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o DPkg::Lock::Timeout=120"
          sudo apt-get $APT update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get $APT install -y -qq cmake libhdf5-dev libvtk9-dev libcgal-dev libtinyxml-dev \
            libboost-program-options-dev libboost-thread-dev libboost-system-dev \
            libboost-filesystem-dev libboost-chrono-dev libboost-date-time-dev \
            libboost-serialization-dev >/dev/null

      - name: Runtime libraries
        timeout-minutes: 15
        if: steps.cache.outputs.cache-hit == 'true'
        run: |
          # man-db triggers can stall package installs on the runners;
          # retries and lock timeouts guard against slow mirrors.
          echo "man-db man-db/auto-update boolean false" | sudo debconf-set-selections
          sudo rm -f /var/lib/man-db/auto-update
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o DPkg::Lock::Timeout=120"
          sudo apt-get $APT update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get $APT install -y -qq libhdf5-dev libvtk9-dev libtinyxml-dev \
            libboost-program-options-dev libboost-thread-dev libboost-system-dev \
            libboost-filesystem-dev libboost-chrono-dev libboost-date-time-dev \
            libboost-serialization-dev >/dev/null

      - name: Build oracle
        env:
          OPENEMS_REV: ${{ steps.rev.outputs.rev }}
        run: sh scripts/openems-oracle/build-native.sh

      - name: Regenerate fixtures
        run: |
          set -e
          found=0
          for s in scripts/openems-oracle/gen-*.sh; do
            [ -e "$s" ] || continue
            found=1
            echo "::group::$s"; bash "$s"; echo "::endgroup::"
          done
          [ "$found" = 1 ] || echo "no gen-*.sh scripts yet"
          {
            echo "### Fixture changes after regeneration"
            echo '```'
            git status --short tests/fixtures/openems || true
            git diff --stat tests/fixtures/openems | tail -n 1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Test against regenerated fixtures
        run: cargo test --all-features

      - name: Upload regenerated fixtures
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: openems-fixtures
          path: tests/fixtures/openems
