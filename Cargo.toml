[package]
name = "ems"
version = "0.0.5"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "Pure Rust FDTD electromagnetic field solver, compatible with openEMS models"
repository = "https://github.com/KarpelesLab/ems"
readme = "README.md"
include = ["src/**/*", "Cargo.toml", "README.md", "LICENSE"]
keywords = ["fdtd", "openems", "electromagnetics", "simulation", "solver"]
categories = ["science", "simulation", "mathematics"]

[features]
default = ["xml"]
## Run openEMS XML files (enables the CSXCAD/openEMS XML support of `csx`).
xml = ["csx/xml"]
## Write field dumps and probes as HDF5 files (`ems::io::h5`), via the
## pure-Rust `hdf5rs` crate.
hdf5 = ["dep:hdf5rs"]
## Enable gzip (deflate) compression of HDF5 datasets.
hdf5-deflate = ["hdf5", "hdf5rs/deflate"]

[dependencies]
csx = { version = "0.0.2", default-features = false }
hdf5rs = { version = "0.0.1", default-features = false, optional = true }

[[bin]]
name = "ems-nf2ff"
required-features = ["hdf5"]

[[bin]]
name = "ems-sar-calc"
required-features = ["hdf5"]

[[example]]
name = "run_xml"
required-features = ["xml"]

# Drop-in replacement for the `openEMS` executable (design §7.2).
[[bin]]
name = "ems"
path = "src/bin/ems/main.rs"
required-features = ["xml"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

# The test suite runs full FDTD simulations; optimised test builds keep it
# fast (debug assertions and overflow checks stay on).
[profile.test]
opt-level = 2
